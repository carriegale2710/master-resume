name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test build script
        run: bash tests/test-build.sh
      - name: Test application generator
        run: bash tests/test-new-application.sh
      - name: Test skill evidence rules
        run: bash tests/test-skill-evidence-rules.sh
      - name: Install docx export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc
      - name: Test docx export
        run: bash tests/test-docx-export.sh
